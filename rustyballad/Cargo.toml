[package]
name = "rustyballad"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Compiled, low-RAM rewrite of the ballad Quickshell shell for niri"
license = "MIT"

[dependencies]
smithay-client-toolkit = "0.19"
tiny-skia = "0.11"
cosmic-text = "0.19"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustix = { version = "0.38", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
