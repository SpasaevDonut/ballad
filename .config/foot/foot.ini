[main]
font=monospace:size=12
initial-color-theme=light

[colors-light]
alpha=0.98
background=f1e5ce
foreground=3a2a20

# Normal / regular ANSI colors (WCAG AA > 5:1 contrast on parchment)
regular0=3a2a20 # Black / dark walnut umber
regular1=7a362d # Red / velvet wine
regular2=4b5d27 # Green / deep antique olive
regular3=8f5509 # Yellow / warm bronze ochre
regular4=2a527a # Blue / Prussian slate blue
regular5=7c3d6d # Magenta / vintage plum
regular6=26636a # Cyan / deep Victorian teal
regular7=655345 # White / muted warm stone

# Bright ANSI colors (adjusted for high readability on light backgrounds)
bright0=a29081  # Bright Black / faded antique sepia (autosuggestions & muted text)
bright1=9a3124  # Bright Red / rich crimson
bright2=4f6222  # Bright Green / rich moss
bright3=854e06  # Bright Yellow / burnished amber
bright4=2b5987  # Bright Blue / rich navy
bright5=8b3c75  # Bright Magenta / damson violet
bright6=1e5f67  # Bright Cyan / dark sea pine
bright7=1c130e  # Bright White / deep ink

# Dimmed colors (blend towards darker for clarity on light parchment)
dim0=4a372c
dim1=622d25
dim2=3c4a1f
dim3=6b4006
dim4=224263
dim5=633157
dim6=1f4f55
dim7=7d6a5c
dim-blend-towards=black

# UI accents, selection & cursor
selection-background=7a362d
selection-foreground=f1e5ce
cursor=3a2a20 b5893f
jump-labels=f1e5ce 7a362d
scrollback-indicator=f1e5ce b5893f
search-box-no-match=f1e5ce 7a362d
search-box-match=f1e5ce 7a7038
urls=7a362d


